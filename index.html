<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidup Mati</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="hud">
      <div id="health" class="panel">
        <div class="label"><span>HEALTH</span><span id="hp-text">100</span></div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
      </div>
      <div id="wavebox" class="panel">
        <div id="wave">Wave -</div>
        <div id="left"></div>
        <div id="kills"></div>
      </div>
      <div id="loadout" class="panel"></div>
      <div id="stats"></div>
    </div>
    <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
    <div id="crosshair"></div>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
